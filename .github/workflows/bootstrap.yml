          # README
          cat > README.md <<'EOF'
# ConfigShift

ConfigShift is an explainable, testable config migrator — convert service
configs between runtimes (Docker Compose, systemd, Kubernetes, nginx, etc.) 
and generate a safe migration plan with human-readable explanations.

This repository is an initial Go scaffold for the project.

Quickstart
---------

1. Install Go 1.20+ and clone this repo (or use the binary once published):

   git clone https://github.com/AwesomeChoccyMilk/configshift.git
   cd configshift

2. Build the CLI:

   go build ./cmd/configshift

3. Run the stub convert command (example):

   ./configshift convert --from compose --to k8s examples/compose/simple-app/docker-compose.yml -o out/

What you get in this scaffold
-----------------------------
- Basic Cobra-based CLI (`configshift`) with `convert` stub
- Placeholder parser and transform packages (compose -> k8s) with TODOs
- Example docker-compose app under `examples/`
- Beaver mascot assets under `assets/logo/`
- CI workflow, CONTRIBUTING, issue templates, and docs

Next steps
----------
Pick one:
- Expand parser coverage (compose -> AST) and implement reliable transforms.
- Add explainability annotations per-transformation.
- Implement migration plan generator and test harness (kind/minikube).

Contributing
------------
See CONTRIBUTING.md and CODE_OF_CONDUCT.md for how to help.
EOF

