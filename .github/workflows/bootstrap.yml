package main

import (
    "fmt"
    "os"

    "github.com/spf13/cobra"
    "github.com/AwesomeChoccyMilk/configshift/pkg/transform"
)

var (
    version = "0.1.0"
)

func main() {
    rootCmd := &cobra.Command{
        Use:   "configshift",
        Short: "ConfigShift — explainable config transforms and safe migrations",
    }

    rootCmd.PersistentFlags().BoolP("verbose", "v", false, "verbose output")

    // version
    rootCmd.AddCommand(&cobra.Command{
        Use:   "version",
        Short: "Print version",
        Run: func(cmd *cobra.Command, args []string) {
            fmt.Println(version)
        },
    })

    // convert
    convertCmd := &cobra.Command{
        Use:   "convert",
        Short: "Convert configuration from one format to another",
        Args:  cobra.ExactArgs(1),
        RunE: func(cmd *cobra.Command, args []string) error {
            from, _ := cmd.Flags().GetString("from")
            to, _ := cmd.Flags().GetString("to")
            out, _ := cmd.Flags().GetString("out")
            input := args[0]

            fmt.Printf("Convert: %s -> %s (input=%s)\n", from, to, input)

            // For now the CLI calls a stub transform function.
            if from == "compose" && to == "k8s" {
                manifests, err := transform.ComposeToK8s(input)
                if err != nil {
                    return err
                }
                // write output file(s)
                if out == "" {
                    out = "out"
                }
                os.MkdirAll(out, 0755)
                fpath := out + "/generated-k8s.yaml"
                if err := os.WriteFile(fpath, []byte(manifests), 0644); err != nil {
                    return err
                }
                fmt.Printf("Wrote: %s\n", fpath)
                return nil
            }

            return fmt.Errorf("conversion path %s -> %s not implemented", from, to)
        },
    }
    convertCmd.Flags().String("from", "", "source format (compose|systemd|nginx)")
    convertCmd.Flags().String("to", "", "target format (k8s|systemd|nginx)")
    convertCmd.Flags().String("out", "", "output directory")
    rootCmd.AddCommand(convertCmd)

    if err := rootCmd.Execute(); err != nil {
        fmt.Fprintln(os.Stderr, err)
        os.Exit(1)
    }
}
EOF

          # pkg/parser/compose.go
          cat > pkg/parser/compose.go <<'EOF'
package parser

import (
    "io/ioutil"

    "gopkg.in/yaml.v3"
)

// ComposeService is a tiny subset of docker-compose service fields used in the
// scaffold. Extend this as needed.
type ComposeService struct {
    Image       string            `yaml:"image"`
    Ports       []string          `yaml:"ports"`
    Environment map[string]string `yaml:"environment"`
}

// ComposeFile represents a very small portion of a docker-compose.yml file.
type ComposeFile struct {
    Version  string                    `yaml:"version"`
    Services map[string]ComposeService `yaml:"services"`
}

// ParseCompose reads a docker-compose YAML file and returns a ComposeFile
// structure. This is intentionally small for the scaffold and should be
// expanded in later iterations.
func ParseCompose(path string) (*ComposeFile, error) {
    b, err := ioutil.ReadFile(path)
    if err != nil {
        return nil, err
    }
    var cf ComposeFile
    if err := yaml.Unmarshal(b, &cf); err != nil {
        return nil, err
    }
    return &cf, nil
}
EOF

          # pkg/transform/k8s.go
          cat > pkg/transform/k8s.go <<'EOF'
package transform

import (
    "fmt"
    "strings"

    "github.com/AwesomeChoccyMilk/configshift/pkg/parser"
)

// ComposeToK8s is a simple stub that converts a single-service compose file to
// a basic Kubernetes Deployment + Service YAML. This is a minimal example to
// get the scaffold running and should be replaced with a proper AST-based
// transform and explainability annotations.
func ComposeToK8s(composePath string) (string, error) {
    cf, err := parser.ParseCompose(composePath)
    if err != nil {
        return "", err
    }

    var sb strings.Builder
    for name, svc := range cf.Services {
        // very basic Deployment
        sb.WriteString(fmt.Sprintf("apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: %s-deployment\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: %s\n  template:\n    metadata:\n      labels:\n        app: %s\n    spec:\n      containers:\n      - name: %s\n        image: %s\n",
            name, name, name, name, svc.Image))
        // ports
        if len(svc.Ports) > 0 {
            sb.WriteString("        ports:\n")
            for _, p := range svc.Ports {
                parts := strings.Split(p, ":")
                containerPort := parts[len(parts)-1]
                sb.WriteString(fmt.Sprintf("        - containerPort: %s\n", containerPort))
            }
        }
        // Service
        sb.WriteString("---\n")
        sb.WriteString(fmt.Sprintf("apiVersion: v1\nkind: Service\nmetadata:\n  name: %s-service\nspec:\n  selector:\n    app: %s\n  ports:\n",
            name, name))
        for _, p := range svc.Ports {
            parts := strings.Split(p, ":")
            port := parts[0]
            target := parts[len(parts)-1]
            sb.WriteString(fmt.Sprintf("  - port: %s\n    targetPort: %s\n", port, target))
        }
        // separator
        sb.WriteString("---\n")
    }

    return sb.String(), nil
}
EOF

