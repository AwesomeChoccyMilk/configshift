  - name: Create test file and push to scaffold/init
    run: |
      set -e
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      mkdir -p scaffold-test
      echo "scaffold smoke test" > scaffold-test/README.txt
      git add .
      if git commit -m "ci: scaffold smoke test" ; then
        git push -u origin HEAD:scaffold/init
        echo "Pushed to branch scaffold/init"
      else
        echo "No changes to commit"
      fi
