          cat > docs/ARCHITECTURE.md <<'EOF'
# Architecture

This document outlines the high-level architecture for ConfigShift (scaffold
edition).

Core components (planned):
- parser/ : Format parsers (docker-compose, systemd, nginx, etc.) — produce a
  canonical intermediate AST.
- transform/ : Rule-based transforms that convert AST nodes between runtimes.
- explain/ : Attach human-readable rationale and risk-level annotations to
  each transform.
- plan/ : Migration plan generator that orders steps and produces rollback
  instructions.
- test/ : Test harness to generate and run smoke tests (local docker/kind).

The current scaffold includes a minimal parser and a simple compose->k8s
transform stub for development purposes.
EOF

