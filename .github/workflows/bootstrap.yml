 name: Create scaffold files and push to scaffold/init
    env:
      GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_NAME: github-actions[bot]
    run: |
      set -euo pipefail
      git config user.name "${GIT_NAME}"
      git config user.email "${GIT_EMAIL}"

      # Make directories
      mkdir -p cmd/configshift pkg/parser pkg/transform examples/compose/simple-app .github/workflows .github/ISSUE_TEMPLATE docs assets/logo
